name: Encrypted PostgreSQL backup
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install PostgreSQL client and encryption tool
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gnupg
      - name: Create encrypted backup
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$BACKUP_ENCRYPTION_KEY"
          umask 077
          export PGSSLMODE=verify-full
          pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --symmetric --cipher-algo AES256 --output budget-postgres.dump.gpg \
              3<<<"$BACKUP_ENCRYPTION_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: budget-postgres-${{ github.run_id }}
          path: budget-postgres.dump.gpg
          retention-days: 30
          if-no-files-found: error
