<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <!--
      Paints the last-known personal/enterprise palette before the app even
      mounts, using the (non-httpOnly) tenant_type cookie the server sets on
      login/register/select-tenant — see server/src/routes/auth.ts. Without
      this, a returning user's browser shows the default neutral/enterprise-
      green :root palette for one frame while main.ts's router guard + the
      session fetch are still in flight. App.vue's own data-mode watcher
      still runs once the real session resolves and overrides this if the
      cookie is stale (a different account signed in, or a fresh logout) —
      this script is a paint hint, not a source of truth.

      Also sets data-theme (light/dark) the same way, before mount, so the
      manual theme toggle (client/src/composables/useTheme.ts) doesn't flash
      the wrong palette either. Dark is the unconditional default absent a
      stored choice — see that composable's header comment for why OS
      prefers-color-scheme is deliberately not consulted here.
    -->
    <script>
      (function () {
        var match = document.cookie.match(/(?:^|; )tenant_type=([^;]*)/);
        var mode = match ? decodeURIComponent(match[1]) : null;
        document.documentElement.dataset.mode = mode === 'personal' || mode === 'enterprise' ? mode : 'neutral';

        var storedTheme = localStorage.getItem('theme');
        document.documentElement.dataset.theme = storedTheme === 'light' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
