services:
  - type: web
    name: budget-tool
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --prefix client && npm ci --include=dev --prefix server && npm run build --prefix client && npm run build --prefix server
    startCommand: npm run db:migrate --prefix server && npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
